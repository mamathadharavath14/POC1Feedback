name: Build and deploy dotnet core project to Azure Function App - Feedback-management

on:
  push:
    branches:
      - feature-feedback-poc
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './TriggerFolder/Trigger'
  DOTNET_VERSION: '8.0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup DotNet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Azure Function
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet restore
          dotnet publish -c Release -o ./output
          popd

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6EAA521C2CB54D09AD883BB712C89374 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_64D4410BC38E4D94B65A36DA66E52582 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1C04B584C5A84748BA80864B58EF4112 }}

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v
         id: fa
         with:
          app-name: 'Feedback-management'
          slot-name: 'Production'
          package: './TriggerFolder/Trigger/output'